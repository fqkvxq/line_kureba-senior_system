<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日の星占い 星座設定 | 合同会社KUREBA</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --accent: #FDE047;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #3B0764 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: #CBD5E1;
      line-height: 1.5;
    }
    .current-badge {
      display: inline-block;
      margin-top: 10px;
      background: rgba(124, 58, 237, 0.35);
      border: 1px solid #A78BFA;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }
    .zodiac-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid #475569;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      user-select: none;
    }
    .zodiac-card:active {
      transform: scale(0.96);
    }
    .zodiac-card.selected {
      background: linear-gradient(135deg, #7C3AED 0%, #4C1D95 100%);
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(253, 224, 71, 0.4);
    }
    .zodiac-emoji {
      font-size: 32px;
      margin-bottom: 4px;
    }
    .zodiac-name {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 2px;
    }
    .zodiac-period {
      font-size: 11px;
      color: #94A3B8;
    }
    .zodiac-card.selected .zodiac-period {
      color: #E2E8F0;
    }
    .submit-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      padding: 12px 16px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .submit-btn {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }
    .submit-btn:disabled {
      background: #475569;
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1E293B;
      border: 1px solid #A78BFA;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>✨ あなたの星座を設定 ✨</h1>
    <p>星座を登録すると、LINE公式アカウントのリッチメニューに毎日あなた専用の今日の運勢・ラッキーカラー・アドバイスが表示されます！</p>
    <div id="current-badge" class="current-badge" style="display: none;">現在の設定: <span id="current-name">未設定</span></div>
  </div>

  <div class="grid" id="zodiac-grid">
    <!-- 12星座をJSで展開 -->
  </div>

  <div style="height: 80px;"></div>

  <div class="submit-bar">
    <button id="save-btn" class="submit-btn" disabled>星座を選択してください</button>
  </div>

  <div id="success-modal" class="modal">
    <div class="modal-content">
      <div style="font-size: 44px; margin-bottom: 8px;">🎉</div>
      <h3 style="font-size: 18px; margin-bottom: 8px; color: #FFFFFF;">設定が完了しました！</h3>
      <p style="font-size: 13px; color: #CBD5E1; margin-bottom: 16px;">
        毎日のリッチメニューが<br><b id="modal-zodiac-name" style="color: #FDE047;"></b>の運勢に切り替わります。
      </p>
      <button onclick="closeLiff()" class="submit-btn" style="padding: 10px;">LINE画面に戻る</button>
    </div>
  </div>

  <script>
    const ZODIACS = [
      { key: 'aries', name: '牡羊座', period: '3/21〜4/19', emoji: '♈' },
      { key: 'taurus', name: '牡牛座', period: '4/20〜5/20', emoji: '♉' },
      { key: 'gemini', name: '双子座', period: '5/21〜6/21', emoji: '♊' },
      { key: 'cancer', name: '蟹座', period: '6/22〜7/22', emoji: '♋' },
      { key: 'leo', name: '獅子座', period: '7/23〜8/22', emoji: '♌' },
      { key: 'virgo', name: '乙女座', period: '8/23〜9/22', emoji: '♍' },
      { key: 'libra', name: '天秤座', period: '9/23〜10/23', emoji: '♎' },
      { key: 'scorpio', name: '蠍座', period: '10/24〜11/22', emoji: '♏' },
      { key: 'sagittarius', name: '射手座', period: '11/23〜12/21', emoji: '♐' },
      { key: 'capricorn', name: '山羊座', period: '12/22〜1/19', emoji: '♑' },
      { key: 'aquarius', name: '水瓶座', period: '1/20〜2/18', emoji: '♒' },
      { key: 'pisces', name: '魚座', period: '2/19〜3/20', emoji: '♓' }
    ];

    let currentUserId = 'debug_user_' + Date.now();
    let selectedZodiac = null;

    async function init() {
      renderGrid();

      try {
        await liff.init({ liffId: "2006900000-xxxx" }); // LIFF ID設定
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
        }
      } catch (e) {
        console.log('LIFF init fallback (running in browser/debug):', e);
      }

      // 既存の星座取得
      fetchCurrentZodiac();
    }

    function renderGrid() {
      const grid = document.getElementById('zodiac-grid');
      grid.innerHTML = '';
      ZODIACS.forEach(z => {
        const card = document.createElement('div');
        card.className = 'zodiac-card';
        card.id = 'card-' + z.key;
        card.innerHTML = `
          <div class="zodiac-emoji">${z.emoji}</div>
          <div class="zodiac-name">${z.name}</div>
          <div class="zodiac-period">${z.period}</div>
        `;
        card.onclick = () => selectZodiac(z.key);
        grid.appendChild(card);
      });
    }

    function selectZodiac(key) {
      selectedZodiac = key;
      document.querySelectorAll('.zodiac-card').forEach(c => c.classList.remove('selected'));
      const activeCard = document.getElementById('card-' + key);
      if (activeCard) activeCard.classList.add('selected');

      const z = ZODIACS.find(item => item.key === key);
      const btn = document.getElementById('save-btn');
      btn.disabled = false;
      btn.innerText = `${z.emoji} ${z.name}に設定する`;
    }

    async function fetchCurrentZodiac() {
      try {
        const res = await fetch(`../api.php?action=get_user_zodiac&user_id=${encodeURIComponent(currentUserId)}`);
        const json = await res.json();
        if (json.status === 'success' && json.zodiac) {
          const z = ZODIACS.find(item => item.key === json.zodiac || item.name === json.zodiac);
          if (z) {
            document.getElementById('current-badge').style.display = 'inline-block';
            document.getElementById('current-name').innerText = `${z.emoji} ${z.name}`;
            selectZodiac(z.key);
          }
        }
      } catch (e) {
        console.error('Fetch error:', e);
      }
    }

    document.getElementById('save-btn').onclick = async () => {
      if (!selectedZodiac) return;
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.innerText = '設定中...';

      try {
        const res = await fetch('../api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `action=save_user_zodiac&user_id=${encodeURIComponent(currentUserId)}&zodiac=${encodeURIComponent(selectedZodiac)}`
        });
        const json = await res.json();
        if (json.status === 'success') {
          const z = ZODIACS.find(item => item.key === selectedZodiac);
          document.getElementById('modal-zodiac-name').innerText = `${z.emoji} ${z.name}`;
          document.getElementById('success-modal').style.display = 'flex';
        } else {
          alert('設定に失敗しました: ' + json.message);
          btn.disabled = false;
        }
      } catch (e) {
        alert('通信エラーが発生しました: ' + e.message);
        btn.disabled = false;
      }
    };

    function closeLiff() {
      if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
        liff.closeWindow();
      } else {
        document.getElementById('success-modal').style.display = 'none';
      }
    }

    window.onload = init;
  </script>
</body>
</html>
