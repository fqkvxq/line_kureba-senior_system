<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロライン カレンダー予約へ移動中...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4338ca;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 8px;
        }
        p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
            line-height: 1.5;
        }
        .fallback-link {
            margin-top: 24px;
            display: inline-block;
            font-size: 13px;
            color: #4338ca;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>📅 カレンダー予約画面へ移動しています...</h2>
    <p>受講生情報を自動セット中ですので少々お待ちください。</p>
    <a id="manualLink" class="fallback-link" style="display: none;">画面が切り替わらない場合はこちらをタップ</a>

    <script>
        const LIFF_ID = '2000276344-YL1wXh0h';
        const DEFAULT_TARGET_URL = 'https://d0o2pa7q.autosns.app/cl/QaOK41fkzp';

        // URLパラメータから転送先を取得（指定がなければデフォルトのカレンダー予約URL）
        const urlParams = new URLSearchParams(window.location.search);
        let targetBaseUrl = urlParams.get('target') || urlParams.get('url') || DEFAULT_TARGET_URL;

        function redirectToTarget(uid, name) {
            try {
                const urlObj = new URL(targetBaseUrl);
                if (uid) {
                    urlObj.searchParams.set('uid', uid);
                }
                if (name) {
                    urlObj.searchParams.set('name', name);
                }
                const finalUrl = urlObj.toString();
                
                const manualLink = document.getElementById('manualLink');
                if (manualLink) {
                    manualLink.href = finalUrl;
                    manualLink.style.display = 'inline-block';
                }

                // 即座にリダイレクト
                window.location.replace(finalUrl);
            } catch (e) {
                // URLパース失敗時の安全フォールバック
                const sep = targetBaseUrl.includes('?') ? '&' : '?';
                let finalUrl = targetBaseUrl + sep + 'uid=' + encodeURIComponent(uid || '');
                if (name) {
                    finalUrl += '&name=' + encodeURIComponent(name);
                }
                window.location.replace(finalUrl);
            }
        }

        async function init() {
            let uid = urlParams.get('uid') || localStorage.getItem('mycar_user_id') || '';
            let name = urlParams.get('name') || localStorage.getItem('mycar_user_name') || '';

            try {
                if (typeof liff !== 'undefined') {
                    await liff.init({ liffId: LIFF_ID });

                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        uid = profile.userId || uid;
                        name = profile.displayName || name;
                        if (uid) localStorage.setItem('mycar_user_id', uid);
                        if (name) localStorage.setItem('mycar_user_name', name);
                    } else if (liff.isInClient()) {
                        liff.login();
                        return;
                    }
                }
            } catch (err) {
                console.warn('LIFF init warning:', err);
            }

            // UID付きでプロライン予約カレンダーへ0秒ジャンプ
            redirectToTarget(uid, name);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
