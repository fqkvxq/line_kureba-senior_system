<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>読み込み中...</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #64748b;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #06C755;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align: center; max-width: 90%; margin: 0 auto;">
        <div class="spinner" id="spinner" style="margin: 0 auto 14px;"></div>
        <div id="statusText" style="font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 6px;">お車情報を準備中...</div>
        <div id="subText" style="font-size: 11px; color: #94a3b8;">LINEトークへお届けしています</div>
        <div id="debugLog" style="display: none; margin-top: 14px; padding: 10px; background: #f1f5f9; border-radius: 8px; font-size: 11px; color: #ef4444; text-align: left; word-break: break-all;"></div>
    </div>

    <script>
        const LIFF_ID = '2011340718-OaRM8tV4';

        document.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('statusText');
            const subEl = document.getElementById('subText');
            const spinnerEl = document.getElementById('spinner');
            const debugEl = document.getElementById('debugLog');

            function showDebug(msg) {
                if (debugEl) {
                    debugEl.style.display = 'block';
                    debugEl.textContent = msg;
                }
            }

            let shouldClose = true;

            try {
                if (typeof liff === 'undefined') {
                    showDebug('LIFF SDKが読み込めませんでした');
                    return;
                }

                await liff.init({ liffId: LIFF_ID });

                if (!liff.isLoggedIn()) {
                    if (liff.isInClient()) {
                        liff.login();
                        return;
                    }
                }

                let userId = '';
                
                // 1. LIFF Contextから取得
                try {
                    const ctx = liff.getContext();
                    if (ctx && ctx.userId) userId = ctx.userId;
                } catch(e) {}

                // 2. ログインプロファイルから取得
                if (!userId) {
                    try {
                        const profile = await liff.getProfile();
                        if (profile && profile.userId) userId = profile.userId;
                    } catch(e) {}
                }

                // 3. IDトークンから取得
                if (!userId) {
                    try {
                        const idToken = liff.getDecodedIDToken();
                        if (idToken && idToken.sub) userId = idToken.sub;
                    } catch(e) {}
                }

                // URLパラメータ（通常クエリ & liff.state）の解析
                const urlParams = new URLSearchParams(window.location.search);
                let queryStr = '';

                const liffState = urlParams.get('liff.state');
                if (liffState) {
                    const cleanState = liffState.startsWith('?') ? liffState.substring(1) : liffState;
                    const stateParams = new URLSearchParams(cleanState);
                    queryStr = stateParams.toString();
                }

                if (!queryStr) {
                    queryStr = urlParams.toString();
                }

                console.log('Executing silent trigger:', { userId, queryStr });

                if (!userId) {
                    shouldClose = false;
                    statusEl.textContent = 'LINEユーザーIDを取得できませんでした';
                    statusEl.style.color = '#ef4444';
                    showDebug('userId is empty. Please open inside LINE app.');
                    return;
                }

                const payload = new URLSearchParams({
                    action: 'trigger_postback',
                    uid: userId,
                    data: queryStr
                });

                const res = await fetch('../api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload.toString()
                });

                const json = await res.json();
                console.log('Trigger API response:', json);

                if (json.success) {
                    if (statusEl) statusEl.textContent = '✅ トークルームにお届けしました！';
                    if (subEl) subEl.textContent = 'トーク画面をご確認ください';
                    if (spinnerEl) spinnerEl.style.display = 'none';
                } else {
                    shouldClose = false;
                    statusEl.textContent = '⚠️ 送信エラーが発生しました';
                    statusEl.style.color = '#ef4444';
                    showDebug('APIエラー: ' + (json.error || json.message || JSON.stringify(json)));
                }
            } catch (e) {
                shouldClose = false;
                console.error('Trigger error:', e);
                statusEl.textContent = '⚠️ 処理中にエラーが発生しました';
                statusEl.style.color = '#ef4444';
                showDebug('Exception: ' + e.message);
            } finally {
                if (shouldClose) {
                    setTimeout(() => {
                        if (typeof liff !== 'undefined' && liff.isInClient()) {
                            liff.closeWindow();
                        } else {
                            window.close();
                        }
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
