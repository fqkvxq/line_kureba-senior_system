<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在庫検索</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #64748b;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #06C755;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        const LIFF_ID = '2011340718-OaRM8tV4';

        function closeWindowNow() {
            try {
                if (typeof liff !== 'undefined' && liff.isInClient()) {
                    liff.closeWindow();
                } else {
                    window.close();
                }
            } catch(e) {
                window.close();
            }
        }

        (async function() {
            try {
                if (typeof liff !== 'undefined') {
                    await liff.init({ liffId: LIFF_ID });

                    let userId = '';
                    try {
                        const ctx = liff.getContext();
                        if (ctx && ctx.userId) userId = ctx.userId;
                    } catch(e) {}

                    if (!userId) {
                        try {
                            const idToken = liff.getDecodedIDToken();
                            if (idToken && idToken.sub) userId = idToken.sub;
                        } catch(e) {}
                    }

                    if (!userId && liff.isLoggedIn()) {
                        try {
                            const profile = await liff.getProfile();
                            if (profile && profile.userId) userId = profile.userId;
                        } catch(e) {}
                    }

                    // クエリパラメータの取得
                    const urlParams = new URLSearchParams(window.location.search);
                    let queryStr = '';
                    const liffState = urlParams.get('liff.state');
                    if (liffState) {
                        const cleanState = liffState.startsWith('?') ? liffState.substring(1) : liffState;
                        queryStr = cleanState;
                    } else {
                        queryStr = window.location.search.startsWith('?') ? window.location.search.substring(1) : window.location.search;
                    }
                    if (!queryStr) {
                        queryStr = 'action=search_all';
                    }

                    if (userId) {
                        const payload = new URLSearchParams({
                            action: 'trigger_postback',
                            uid: userId,
                            data: queryStr
                        });

                        const apiUrl = new URL('../api.php', window.location.href).href;
                        await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: payload.toString()
                        });
                    }
                }
            } catch(err) {
                console.warn('Trigger error:', err);
            } finally {
                // 即座にウィンドウを閉じる
                closeWindowNow();
                setTimeout(closeWindowNow, 200);
            }
        })();
    </script>
</body>
</html>
